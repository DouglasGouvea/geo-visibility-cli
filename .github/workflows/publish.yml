name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          python - <<'PY'
          import ast, os, sys
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          tree = ast.parse(open("src/geo_check/__init__.py").read())
          version = next(
              ast.literal_eval(n.value)
              for n in tree.body
              if isinstance(n, ast.Assign)
              and any(getattr(t, "id", None) == "__version__" for t in n.targets)
          )
          if tag != version:
              sys.exit(f"Tag {tag!r} != geo_check.__version__ {version!r}")
          print(f"OK: tag and version are {version}")
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC); no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
