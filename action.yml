name: "GEO Visibility Check"
description: "Check how AI answer engines (Perplexity) mention your brand and whether your site allows AI crawlers."
branding:
  icon: search
  color: blue

inputs:
  category:
    description: "Business category, e.g. dentist"
    required: true
  city:
    description: "City, e.g. Campinas"
    required: true
  brand:
    description: "Brand name to look for"
    required: true
  site:
    description: "Site URL to check robots.txt for AI crawlers (optional)"
    required: false
    default: ""
  dry-run:
    description: "Simulate without network or API key"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install geo-visibility-cli
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Run geo-check
      shell: bash
      env:
        INPUT_CATEGORY: ${{ inputs.category }}
        INPUT_CITY: ${{ inputs.city }}
        INPUT_BRAND: ${{ inputs.brand }}
        INPUT_SITE: ${{ inputs.site }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
      run: |
        args=("$INPUT_CATEGORY" "$INPUT_CITY" --brand "$INPUT_BRAND")
        if [ -n "$INPUT_SITE" ]; then args+=(--site "$INPUT_SITE"); fi
        if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
        geo-check "${args[@]}"
