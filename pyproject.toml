[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-visibility-cli"
version = "0.1.0"
description = "Check how AI answer engines mention your brand (GEO visibility) and whether your site allows AI crawlers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Douglas Gouvea Manoel" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
geo-check = "geo_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
